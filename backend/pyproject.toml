[project]
name = "simple-khata-backend"
version = "0.1.0"
description = "Backend API for Simple Khata"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]